version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
    # Subidas que NO se pueden aceptar tal cual (motivos y ruta en docs/DEPENDENCIES.md).
    ignore:
      # Angular se sube de versión mayor con `ng update`, de una en una (22 → 23…), junto con
      # TypeScript y zone.js, que dicta cada versión de Angular.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Jasmine 7 rompe el parche de zone.js (aún con zone.js 0.16): los tests no arrancan.
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
